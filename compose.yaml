name: justsupply

services:
  database:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: justsupply
      POSTGRES_USER: justsupply
      POSTGRES_PASSWORD: justsupply
    ports:
      - "5433:5432"
    volumes:
      - justsupply_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justsupply -d justsupply"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - justsupply_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  justsupply_postgres_data:
  justsupply_redis_data:
