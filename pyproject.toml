[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justsupply"
version = "0.1.0"
description = "Consumer product search with cited ethical and environmental evidence."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "google-genai==2.25.0",
    "httpx2>=2.12,<3",
    "langchain-core==1.6.3",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["justsupply*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = [
    "integration: tests that require the PostgreSQL service",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "backend"
